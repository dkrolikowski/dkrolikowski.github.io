<title>HPF Dashboard Index</title>
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --text:    #e6edf3;
    --muted:   #8b949e;
    --accent:  #58a6ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    padding: 2rem;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.25rem;
    margin-bottom: 2rem;
  }

  header h1 {
    font-size: 2rem;
    letter-spacing: 0.15em;
    color: var(--accent);
  }

  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.3rem;
    letter-spacing: 0.05em;
  }

  .target-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .target-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem 1.5rem;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .target-card:hover {
    border-color: var(--accent);
    background: rgba(88,166,255,0.05);
  }

  .target-card .name {
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 0.1em;
  }

  .target-card .status {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .missing {
    opacity: 0.4;
    cursor: default;
    pointer-events: none;
  }
</style>
</head>
